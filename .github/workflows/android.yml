name: Android

on:
  push:
    branches: ['**']
    # Tags v* are released for every platform by release.yml.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Publish this build as a GitHub prerelease (works from any branch)'
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    # A commit marked [release] is built once, by release.yml.
    if: ${{ !(github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')) }}
    uses: ./.github/workflows/android-build.yml
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  # The only job that can write to the repository: it downloads the files the build job made and attaches them.
  prerelease:
    name: Publish GitHub prerelease (manual, any branch)
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease && !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: QuillFolio-*
          path: out
          merge-multiple: true
      - name: Checksums
        run: |
          cd out
          sha256sum QuillFolio-* > SHA256SUMS.txt
          ls -la
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ needs.build.outputs.version }}-build.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Anne's Folio ${{ needs.build.outputs.version }} (build ${{ github.run_number }})
          prerelease: true
          generate_release_notes: true
          body: |
            Test build from branch `${{ github.ref_name }}` at ${{ github.sha }}.
            Install the APK on Android by sideloading (see docs/ANDROID.md).
            ${{ needs.build.outputs.signing == 'debug' && 'Signed with a throwaway debug key: it cannot update an installed copy signed with another key, and a later build cannot update it (uninstall first).' || 'Signed with the release key.' }}
          files: |
            out/QuillFolio-*.apk
            out/QuillFolio-*.aab
            out/SHA256SUMS.txt
