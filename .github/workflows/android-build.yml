name: Android build

# Builds the APK and the AAB and uploads them as workflow artifacts. Called by android.yml (every
# push, pull requests, manual runs) and by release.yml. This workflow only reads the repository;
# publishing is a separate job in the callers, so nothing that runs here (npm packages, Gradle
# plugins, third-party actions) holds a token that can write to it.

on:
  workflow_call:
    inputs:
      checks:
        description: 'Run the type check, the unit tests and the browser smoke test before building'
        type: boolean
        default: true
      require_release_key:
        description: 'Fail when the release keystore secret is missing (a published release must not be signed with a throwaway debug key)'
        type: boolean
        default: false
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
    outputs:
      version:
        description: 'The app version (package.json)'
        value: ${{ jobs.build.outputs.version }}
      signing:
        description: '"release" when signed with the release key, "debug" when signed with a debug key'
        value: ${{ jobs.build.outputs.signing }}

permissions:
  contents: read

jobs:
  build:
    name: Build APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      signing: ${{ steps.keystore.outputs.signing }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # First, so that a release without its key stops before the long build.
      - name: Decode release keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          REQUIRE_RELEASE_KEY: ${{ inputs.require_release_key }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            KS="$RUNNER_TEMP/quillfolio-release.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KS"
            echo "ANDROID_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
            echo "signing=release" >> "$GITHUB_OUTPUT"
            echo "Release keystore decoded; release builds will be signed with it."
          elif [ "$REQUIRE_RELEASE_KEY" = "true" ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is not set. A published release must be signed with the release key: a debug key differs on every build machine, so users could not update the app in place. See docs/ANDROID.md (Signing)."
            exit 1
          else
            echo "signing=debug" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set: the APK/AAB are signed with a DEBUG key (fine for testing; it cannot update a copy signed with another key and Google Play does not accept it)."
          fi

      # versionCode must only grow, whichever workflow (Android or Release) builds the APK, so it is
      # minutes since 2024-01-01 rather than a per-workflow run number.
      - name: Version code
        run: echo "VERSION_CODE=$(( ($(date -u +%s) - 1704067200) / 60 ))" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        if: inputs.checks
        run: npm run typecheck

      - name: Unit tests
        if: inputs.checks
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Browser smoke test
        if: inputs.checks
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

      - name: Read app version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Anne's Folio version $VERSION, versionCode $VERSION_CODE"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # The legacy "tools" package (the action's default) no longer exists in the SDK repository.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build release APK and AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease

      - name: Collect outputs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p out
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab | head -n 1)
          cp "$APK" "out/QuillFolio-$VERSION.apk"
          cp "$AAB" "out/QuillFolio-$VERSION.aab"
          ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuillFolio-${{ steps.version.outputs.version }}-apk
          path: out/QuillFolio-*.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: QuillFolio-${{ steps.version.outputs.version }}-aab
          path: out/QuillFolio-*.aab
          if-no-files-found: error
